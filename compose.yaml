name: gamebook-local

services:
  authuser:
    build:
      context: ../GameBook.Microservice.AuthUser
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./compose.authuser.env
        required: false
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PORT: "3001"
    healthcheck:
      test:
        ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:3001/docs/openapi.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    ports:
      - "3001:3001"
    restart: unless-stopped
    volumes:
      - ../GameBook.Microservice.AuthUser:/app
      - authuser_node_modules:/app/node_modules

  game:
    build:
      context: ../GameBook.Microservice.Game
      dockerfile: Dockerfile.dev
    depends_on:
      authuser:
        condition: service_healthy
    env_file:
      - path: ./compose.game.env
        required: false
    environment:
      AUTHUSER_URL: http://authuser:3001
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PORT: "3002"
    healthcheck:
      test:
        ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:3002/docs/openapi.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    ports:
      - "3002:3002"
    restart: unless-stopped
    volumes:
      - ../GameBook.Microservice.Game:/app
      - game_node_modules:/app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      authuser:
        condition: service_healthy
      game:
        condition: service_healthy
    env_file:
      - path: ./compose.frontend.env
        required: false
    environment:
      NEXT_PUBLIC_AUTHUSER_URL: http://localhost:3001
      NEXT_PUBLIC_GAME_URL: http://localhost:3002
      PORT: "3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

volumes:
  authuser_node_modules:
  frontend_node_modules:
  game_node_modules:
